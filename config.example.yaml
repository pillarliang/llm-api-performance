  base_url_env: DASHSCOPE_BASE_URL
  api_key_env: DASHSCOPE_API_KEY
  enabled: true
  include_usage: true
  profiles:
  - name: 'off'
    thinking_enabled: false
    parameters:
      enable_thinking: false
