# 模型和思考参数来自需求快照，运行前请确认当前账号支持情况。
# base_url 可被同一默认密钥对应的 DASHSCOPE_BASE_URL 环境变量覆盖。
name: llm-performance-smoke
version: v1
repetitions: 3
warmup: 0
concurrencies:
- 10
input_tokens:
- 512
- 1024
timeout_seconds: 300
cache_state: uncontrolled
parameters: {}
tasks:
- id: summary
  template_file: prompts/summary.txt
  corpus_file: prompts/corpus.txt
models:
- id: qwen3.8-max
  model: qwen3.8-max
