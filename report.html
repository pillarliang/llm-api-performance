<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM API 性能评测报告</title>
<style>/* Report design follows llm-performance-547de8c9fda191ddd9991340386e566b.html. */
.offline-report{margin:0;background:#f3f6fa;color:#1d2938}
.offline-report main{box-sizing:border-box;max-width:1600px;margin:auto;padding:32px}
.performance-report{--ink:#1d2938;--muted:#68788c;--line:#e0e6ed;--blue:#245ddd;--surface:#fff;--bg:#f3f6fa;font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif;color:var(--ink)}
.performance-report *{box-sizing:border-box}
.performance-report [hidden]{display:none!important}
.performance-report .report-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
.performance-report h1{font-size:28px;letter-spacing:-.8px;margin:4px 0;font-weight:700}
.performance-report h2{font-size:18px;margin:0 0 14px;font-weight:700}
.performance-report p{margin:12px 0 0}
.performance-report .report-eyebrow{color:var(--blue);font-size:11px;font-weight:700;letter-spacing:2px}
.performance-report .report-muted,.performance-report .stat-label,.performance-report .stat-note{color:var(--muted);font-size:14px}
.performance-report .report-badge{display:inline-block;border-radius:20px;padding:5px 12px;background:#e8eefc;color:#234fab;font-size:12px;white-space:nowrap}
.performance-report .report-synthetic{background:#fff0ce;color:#8b5600;padding:14px 20px;border:1px solid #f2d28b;border-radius:12px;margin-bottom:20px}
.performance-report .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:20px 0}
.performance-report .stat,.performance-report .report-panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:20px}
.performance-report .stat-value{font:650 30px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:normal;font-variant-numeric:tabular-nums;color:var(--ink)}
.performance-report .report-panel{margin-top:20px;min-width:0}
.performance-report .report-filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:18px}
.performance-report .report-filter{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.performance-report select,.performance-report button{font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:var(--ink);padding:8px 10px;min-height:0;max-width:100%}
.performance-report button{cursor:pointer;display:inline-block}
.performance-report button:hover{border-color:var(--blue);color:var(--blue);background:#fff}
.performance-report button:disabled{opacity:.45;cursor:default}
.performance-report select,.performance-report summary{cursor:pointer}
.performance-report input[type=checkbox]{min-width:0;width:15px;height:15px;min-height:0;margin:0;flex:none;accent-color:var(--blue)}
.performance-report :is(button,select,input,summary):focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.performance-report .report-picker{position:relative;margin:0;border:0;padding:0;min-width:180px}
.performance-report .report-filter:first-child .report-picker{min-width:220px}
.performance-report .report-picker>summary{display:flex;align-items:center;justify-content:space-between;gap:16px;list-style:none;font-weight:400;border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:8px 10px;font-size:14px;color:var(--ink)}
.performance-report .report-picker>summary::-webkit-details-marker{display:none}
.performance-report .report-picker>summary::after{content:'▾';color:var(--muted)}
.performance-report .report-picker[open]>summary::after{content:'▴'}
.performance-report .report-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:10;min-width:100%;width:max-content;max-width:min(360px,calc(100vw - 64px));padding:8px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #1d293814}
.performance-report .report-menu-actions{display:flex;gap:8px;padding:0 4px 8px;border-bottom:1px solid var(--line)}
.performance-report .report-menu-actions button{font-size:12px;padding:3px 8px}
.performance-report .report-options{max-height:320px;overflow:auto;padding-top:4px}
.performance-report .report-option{display:flex;align-items:center;gap:9px;padding:8px;border-radius:5px;cursor:pointer;color:var(--ink);font-size:13px;overflow-wrap:anywhere}
.performance-report .report-option:hover{background:#f3f6fa}
.performance-report .report-profile-menu{width:340px}
.performance-report .report-menu-note{font-size:12px;color:var(--muted);margin:4px 8px 12px}
.performance-report .report-profile-group{border:0;border-top:1px solid var(--line);margin:4px 0 12px;padding:8px;min-width:0}
.performance-report .report-profile-group legend{font-size:12px;font-weight:600;overflow-wrap:anywhere;max-width:100%;padding:0 4px;color:var(--ink)}
.performance-report .report-profile-group:disabled{opacity:.45}
.performance-report .report-profile-choices{display:flex;flex-wrap:wrap;gap:6px}
.performance-report .report-profile{display:flex;align-items:center;gap:6px;padding:4px 7px;border:1px solid var(--line);border-radius:5px;font-size:12px;cursor:pointer}
.performance-report .report-profile:has(input:checked){background:#e8eefc;border-color:#bdcffa;color:#234fab}
.performance-report .report-model-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px;font-size:12px}
.performance-report .report-legend-item{display:inline-flex;align-items:center;gap:7px;overflow-wrap:anywhere}
.performance-report .report-swatch{width:10px;height:10px;border-radius:50%;background:var(--model-color);flex:none}
.performance-report .table-scroll{overflow:auto;border:0;border-radius:0;background:transparent}
.performance-report table{border-collapse:collapse;border-spacing:0;width:100%;white-space:nowrap;font-size:13px;min-width:950px}
.performance-report th,.performance-report td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);font-size:13px}
.performance-report th{font-size:12px;color:var(--muted);background:#f7f9fc;font-weight:600}
.performance-report th button{font-size:12px;border:0;border-radius:0;padding:0;min-height:0;background:transparent;text-align:left;font-weight:600;color:inherit}
.performance-report th[aria-sort=ascending],.performance-report th[aria-sort=descending]{color:var(--blue)}
.performance-report th:nth-child(3),.performance-report th:nth-child(4),.performance-report th:nth-child(n+6){text-align:right}
.performance-report td.metric-cell{text-align:right;font-family:inherit;font-variant-numeric:tabular-nums}
.performance-report .report-model-row{background:var(--model-bg)}
.performance-report .report-model-row:hover{background:var(--model-hover)}
.performance-report tbody tr:last-child td{border-bottom:1px solid var(--line)}
.performance-report .report-model-name{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--model-color)}
.performance-report .cell-sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.performance-report .report-inline-bar{display:inline-block;height:5px;border-radius:4px;background:var(--model-color);vertical-align:middle;margin-right:8px}
.performance-report .report-ok{color:#14825c}
.performance-report .report-bad{color:#bc4c31}
.performance-report .report-note{font-size:12px;color:var(--muted);margin:12px 0 0}
.performance-report .empty{text-align:center;padding:32px;color:var(--muted)}
.performance-report .report-detail{margin:12px 0;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0 0}
.performance-report .report-detail>summary{font-weight:600}
.performance-report .report-detail>.table-scroll{margin-top:12px}
.performance-report pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8fb;padding:16px;border-radius:8px;font-size:12px;max-height:460px;overflow:auto}
.performance-report .report-footer{margin:24px 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
#results:has(.performance-report)>.heading h1,#results:has(.performance-report)>.heading p{display:none}
#results:has(.performance-report)>.heading{justify-content:flex-end}
#results .performance-report{background:var(--bg);padding:24px;border-radius:12px}
@media(max-width:800px){.offline-report main{padding:16px}.performance-report .report-header{align-items:start;flex-direction:column}.performance-report .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.performance-report h1{font-size:24px}.performance-report .report-panel{padding:14px}#results .performance-report{padding:14px}.performance-report .report-filters{gap:10px}.performance-report .report-filter{flex:1 1 40%}.performance-report .report-picker,.performance-report .report-filter:first-child .report-picker{min-width:0}.performance-report .report-menu{max-width:min(300px,calc(100vw - 88px))}.performance-report .report-filter:nth-child(2) .report-menu{left:auto;right:0}}
@media print{.offline-report{background:#fff}.offline-report main{padding:0}.performance-report .report-filters{display:none}.performance-report .table-scroll{overflow:visible}.performance-report table{min-width:0}.performance-report th,.performance-report td{padding:6px;font-size:9px}.performance-report .stat{break-inside:avoid}.performance-report .report-model-row{print-color-adjust:exact}}
</style>
</head>

  const footer=el("footer",`${source} · ${data.started_at||"—"} → ${data.finished_at||"—"} · 筛选同步更新统计卡片与表格。`,"report-footer");
  root.append(stats,panel,diagnostics,definitions,footer);
  // Bind to this render root so reopening a run does not accumulate document listeners.
  root.onclick=event=>pickers.forEach(p=>{if(!p.contains(event.target))p.open=false;});
  root.onkeydown=event=>{if(event.key==="Escape")pickers.forEach(p=>{if(p.open){p.open=false;p.querySelector("summary").focus();}});};
  reset.addEventListener("click",()=>{
    models.forEach(m=>{m.enabled=true;m.profiles.forEach((_,key)=>m.profiles.set(key,true));});
    Object.values(selector).forEach(s=>{s.value="";});statistic.value="p50";sortKey="model";direction=1;
    pickers.forEach(p=>{p.open=false;});update();
  });
  function metric(group,key){
    const quantile=statistic.value==="tail"?(key==="output_speed_tps"?"p5":"p95"):statistic.value;
    const value=group.metrics?.[key]?.[quantile];return Number.isFinite(value)?value:null;
  }
  function value(group,key){
    if(key==="model")return group.model||group.endpoint_id||"";
    if(key==="success_rate")return group.planned_cases?group.successful_cases/group.planned_cases:null;
    if(metrics.some(([k])=>k===key))return metric(group,key);
    return group[key]??null;
  }
  function modelCell(group){
    const td=el("td"),name=el("span",group.model||group.endpoint_id,"report-model-name");
    td.title=`端点：${group.endpoint_id||"默认"}`;td.append(name,el("span",group.profile??"default","cell-sub"));return td;
  }
  function update(){
    let enabled=0,profileCount=0,profileTotal=0;
    models.forEach(m=>{
      m.check.checked=m.enabled;m.field.disabled=!m.enabled;
      m.inputs.forEach(([input,profile])=>{input.checked=m.profiles.get(profile);input.disabled=!m.enabled;});
      if(m.enabled){enabled++;profileTotal+=m.profiles.size;profileCount+=[...m.profiles.values()].filter(Boolean).length;}
    });
    modelPicker.summary.textContent=enabled===models.size?`全部模型（${enabled}）`:enabled?`已选 ${enabled} 个模型`:"请选择模型";
    profilePicker.summary.textContent=enabled===0?"请先选择模型":profileCount===profileTotal?"各模型全部配置":`已选 ${profileCount} / ${profileTotal} 项`;
    visible=groups.filter(g=>{const m=models.get(modelKey(g));return m.enabled&&m.profiles.get(String(g.profile??"default"))&&Object.entries(selector).every(([key,s])=>!s.value||String(g[key])===s.value);});
    visible.sort((a,b)=>{const x=value(a,sortKey),y=value(b,sortKey);if(x==null)return y==null?0:1;if(y==null)return -1;return (typeof x==="number"?x-y:String(x).localeCompare(String(y)))*direction;});
    sortHeaders.forEach(([th,button,key,name])=>{
      const active=key===sortKey;th.setAttribute("aria-sort",active?(direction===1?"ascending":"descending"):"none");button.textContent=name+(active?(direction===1?" ↑":" ↓"):" ↕");
    });
    const sum=key=>visible.reduce((n,g)=>n+(g[key]||0),0);
    const planned=sum("planned_cases"),successful=sum("successful_cases");
    stats.replaceChildren();
    [["计划测试项",fmt(planned),`${visible.length} 个测试组`],["测试项成功率",planned?fmt(100*successful/planned)+"%":"—",`${successful} 项成功`],["待补跑项",fmt(planned-successful),"包含失败、取消与缺失项"],["统计请求次数",fmt(sum("requests")),"不含预热和主动取消"]].forEach(([label,n,note])=>{
      const card=el("div",undefined,"stat");card.append(el("div",label,"stat-label"),el("div",n,"stat-value"),el("div",note,"stat-note"));stats.append(card);
    });
    legend.replaceChildren();
    const visibleModels=new Set(visible.map(modelKey));
    models.forEach((m,key)=>{if(!visibleModels.has(key))return;const item=el("span",undefined,"report-legend-item");color(item,m);const dot=el("span",undefined,"report-swatch");dot.setAttribute("aria-hidden","true");item.append(dot,el("span",m.group.model||m.group.endpoint_id));item.title=`端点：${m.group.endpoint_id}`;legend.append(item);});
    body.replaceChildren();usageBody.replaceChildren();
    const maxSpeed=Math.max(1,...visible.map(g=>metric(g,"output_speed_tps")||0));
    visible.forEach(group=>{
      const tr=el("tr",undefined,"report-model-row");color(tr,models.get(modelKey(group)));
      tr.append(modelCell(group),el("td",group.task),el("td",fmt(group.benchmark_input_tokens),"metric-cell"),el("td",fmt(group.concurrency),"metric-cell"));
      const rate=value(group,"success_rate");tr.append(el("td",rate==null?"—":fmt(rate*100)+"%",rate===1?"report-ok":"report-bad"));
      metrics.forEach(([key])=>{const n=metric(group,key),td=el("td",undefined,"metric-cell");
        if(key==="output_speed_tps"&&n!=null){const bar=el("span",undefined,"report-inline-bar");bar.style.width=`${48*Math.max(0,n)/maxSpeed}px`;bar.setAttribute("aria-hidden","true");td.append(bar);}
        td.append(el("span",fmt(n)));tr.append(td);
      });body.append(tr);
      const u=el("tr",undefined,"report-model-row");color(u,models.get(modelKey(group)));
      u.append(modelCell(group),el("td",group.task),el("td",`${fmt(group.benchmark_input_tokens)} / ${group.concurrency}`,"metric-cell"));
      ["benchmark_answer_tokens","prompt_tokens","reasoning_tokens"].forEach(key=>u.append(el("td",fmt(group.metrics?.[key]?.mean),"metric-cell")));
      u.append(el("td",Object.entries(group.errors||{}).map(([k,n])=>`${k}: ${n}`).join(" · ")||"—"));usageBody.append(u);
    });
    empty.hidden=visible.length>0;
    const conditions=new Set(visible.map(g=>JSON.stringify([g.task,g.target_input_tokens,g.concurrency])));
    selection.textContent=`展示 ${visible.length} / ${groups.length} 组 · ${statistic.selectedOptions[0].textContent}${conditions.size>1?" · 当前包含不同测试条件，建议筛选相同任务、输入和并发再比较。":""}`;
    pre.textContent=JSON.stringify(visible,null,2);csv.disabled=!visible.length;
  }
  csv.addEventListener("click",()=>{
    const exportColumns=[["model","Model"],["profile","Profile"],["endpoint_id","Endpoint"],...columns.slice(1)];
    const escape=v=>'"'+String(v??"").replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';
    const rows=[exportColumns.map(([,title])=>title),...visible.map(g=>exportColumns.map(([key])=>value(g,key)))];
    const url=URL.createObjectURL(new Blob(["\ufeff"+rows.map(row=>row.map(escape).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}));
    const a=el("a");a.href=url;a.download=`performance-${statistic.value}.csv`;root.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  update();
};
</script>
<script>window.renderReport(document.getElementById("report"), JSON.parse(document.getElementById("report-data").textContent));</script>
</body>
</html>
